<svg viewBox="47 16 949 949" version="1.1" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Andy O-Matic Robot Vector</title>
  <desc id="desc">Affinity-safe roster vector of Andy, O-Matic photography coach, using the new robot model with a camera held up, an aperture core, a flash-head antenna, and graphite camera-body accents. Task #751 (2026-09-28, Monet): chest O-ring restored from the registered master brand/omatic-robot-vector-no-bg.svg (sha256 837fbc0156a023ec) at its own geometry, gold r66 + teal r35 at 510,658; palette rebound to the master's gradients per decision #522; the role instrument moved off the chest per brand_messaging #120; no red on the robot (color.alert).</desc>

  <!-- PROVENANCE. This is a VARIANT of the existing roster figure, not a drawing.
       Every shared element below - shadow ellipse, antenna collar, head shell, visor,
       eyes, speculars, smile, cream shine, ear cups, neck, torso, torso highlight,
       both arms, both legs, both feet, foot shines - is copied VERBATIM, path data and
       stroke weights untouched, from the governed roster siblings:
         brand/omatic-robot-carver-standalone-affinity.svg   (brand_assets id 19)
         brand/omatic-robot-monet-standalone-affinity.svg    (brand_assets id 25)
         brand/omatic-robot-probot-standalone-affinity.svg   (brand_assets id 27)
       all three status=active, is_master=true, "operator-confirmed Session 76".
       Measured 2026-09-12: the shared chassis is byte-identical across all five modern
       siblings (carver, data, monet, probot-standalone, smith) - ten separate path and
       geometry strings checked, 5/5 each. Cross-checked against the layered master
         ART/o-matic/master/omatic-robot-samples-vector-affinity.af
         (identity.master.mascot_samples)
       opened with `open -a Affinity` and rendered via render_spread. Document.load() was
       NOT used - it renders dark with a purple cast (known SDK defect).

       Mandated by identity.mascot.derivation_rule: "Never draw an o-MATIC robot from a
       description - open the master and derive from it; any new robot mark is a crop or
       variant of the existing figure."

       WHAT IS NEW, AND ONLY THIS. Four persona elements, each built on the family's own
       accessory idiom and none of which touches the silhouette:
         1. #flash-head    - probot's single-stem antenna verbatim; the gold ball gains
                             spark strokes. Gold sparks are already family vocabulary
                             (identity.mascot.expressions.thumbs_up: "gold motion sparks").
                             Antenna variation is an established persona lever - probot
                             carries one stem, monet and smith carry two.
         2. #aperture-core - the chest core slot every sibling fills: probot
                             #orchestrator-core, monet #dashboard-core, carver
                             #build-panel, data #analysis-core. Same centre, same radius
                             and same stroke weight as probot's core.
         3. #camera        - an instrument in the right hand, exactly as carver holds
                             #wrench, monet #chart-tablet and data #magnifier. Placed by
                             translate+rotate over the forearm with the cream finger
                             circles drawn AFTER it, which is how all three siblings read
                             as gripping rather than overlapping.
         4. #darkroom-backdrop - the optional backdrop group carver, data, monet and
                             smith each carry.

       INK. The family's ink is one value and it is used on every stroke here. The four
       rejected proposals of 2026-09-12 11:09 recolored it on 34-38 elements per file
       (measured: 0 occurrences of the family ink, 34-38 of a substitute), which is what
       flattened the weighted outline the operator called out. Nothing here is recolored.

       PALETTE. teal, gold and cream gradients are the siblings' exact stop values.
       The one added gradient is a neutral graphite for the camera body - a value, not a
       hue, chosen so Andy adds no sixth accent colour to a roster that already spends
       orange (carver), blue (data), purple (monet) and red (smith). Gold does the
       persona work instead. Per the badge-mark precedent, mascot hexes are OFF-TOKEN
       against the five color.* tokens by design and brand_lint reports them as [P]; the
       governed master carries the same findings. They are deliberately not spelled out
       in this comment, because brand_lint scans comment text as well as paint.

       NOT CANONICAL. No brand_assets or persona_asset row exists for this file and none
       was written. Indexing is Data's lane and waits on the operator's approval. -->

