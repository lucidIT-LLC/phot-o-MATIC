name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    # macos-26, NOT macos-15, and the change is load-bearing.
    #
    # 0.3.0 moved the platform floor to macOS 26 because the classic
    # AVAssetReader path is deprecated on macOS 27 and its replacement,
    # AVAssetReaderOutput.Provider, is @available(macOS 26.0, *). A macos-15
    # runner ships an SDK that has neither the deprecation nor the replacement,
    # so it cannot build this package at all.
    #
    # It also could not build 0.2.0: the v0.2.0 tag's own CI run (34698731947)
    # FAILED on macos-15 / Xcode 16.4 / Swift 6.0 with "static property 'kernel'
    # is not concurrency-safe", and the tag was cut anyway. The tag-vs-source
    # check below therefore never ran on that release. Fixed in 0.3.0 with
    # nonisolated(unsafe) on the kernel, and recorded here so the next person
    # does not trust a green badge that was never green.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      # Build ONCE, capturing the log, because the deprecation check below reads
      # it. A second `swift build` would be incremental and emit no warnings at
      # all, which would make the check pass by producing nothing — the exact
      # failure mode this repository is about.
      - name: Build
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee /tmp/build.log

      # There must be NO deprecation warnings from the reader or writer paths.
      # This is the control that keeps Walk from drifting back onto the classic
      # API by accident — the one thing 0.3.0 exists to prevent.
      - name: No deprecated AVFoundation reader/writer API
        run: |
          # Match DIAGNOSTICS only, not the source snippets a diagnostic quotes.
          # WalkKit's comments name every deprecated call deliberately, and the
          # compiler prints surrounding source lines with each warning.
          if grep -E "warning:.*(deprecated in macOS 27|deprecated: 27)" /tmp/build.log; then
            echo "::error::a deprecated macOS 27 AVFoundation call is back in the build"
            exit 1
          fi
          # And in the source, not only in the diagnostics.
          #
          # COMMENT LINES ARE EXCLUDED ON PURPOSE. WalkKit names every one of
          # these deprecated calls in prose, because the comments explain what
          # was replaced and why — a correct fix names the retired thing in
          # order to forbid it. A keyword grep that cannot tell a comment from a
          # call would fail on the documentation and pass on the defect.
          HITS=$(grep -rnE "startReading\(|copyNextSampleBuffer|AVAssetWriterInputPixelBufferAdaptor|alwaysCopiesSampleData|\.startWriting\(" Sources/ App/ \
                 | grep -vE ":[0-9]+:[[:space:]]*(//|\*|///)" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::deprecated reader/writer API found in source (outside a comment)"
            exit 1
          fi
          echo "no deprecated reader/writer API in code"

      # AND THE WIDER CONTROL, ADDED IN 0.4.0 BECAUSE THE NARROW ONE READ AS
      # BROAD. The step above only ever looked for "deprecated in macOS 27",
      # which was 0.3.0's whole job. MEASURED 2026-09-12: v0.3.0's own green run
      # (34701326745) emitted 58 lines of a DIFFERENT deprecation — Core Image
      # Kernel Language, deprecated since macOS 10.14 — and passed, while
      # decision #504 recorded "Zero deprecation diagnostics". The control was
      # true and the sentence about it was not.
      #
      # This inventories every deprecation in the build and fails on any that is
      # not in .github/deprecations-allowed.txt with a reason and an owner. It
      # ALSO fails on an allowlist entry that no longer occurs, so the file
      # cannot rot into a list of exceptions nobody has checked.
      - name: Deprecation inventory matches the allowlist
        run: ./.github/check-deprecations.sh /tmp/build.log

      - name: Test
        run: |
          set -o pipefail
          swift test --build-system native 2>&1 | tee /tmp/test.log

      # THE README STATES A TEST COUNT, SO THE COUNT IS CHECKED. Same defect
      # class as everything else here: a number in prose that was true once.
      # It drifted three times inside 0.4.0 alone — 48, then 50, then 51 — and
      # each time it was corrected by hand, which is the part that does not
      # scale. The skip count is reported too, because the known-answer tests
      # cannot run on a CI runner and a green badge must not read as a verified
      # known answer.
      - name: README's test count matches the suite
        run: |
          RAN=$(grep -oE "Test run with [0-9]+ tests" /tmp/test.log | tail -1 | grep -oE "[0-9]+")
          SAID=$(grep -oE "make test +# [0-9]+ tests" README.md | grep -oE "[0-9]+" | tail -1)
          SKIPPED=$(grep -c "skipped" /tmp/test.log || true)
          echo "suite ran $RAN; README says $SAID; $SKIPPED skip lines in the log"
          [ -n "$RAN" ] || { echo "::error::could not read a test count out of the test log"; exit 1; }
          [ -n "$SAID" ] || { echo "::error::README no longer states a test count"; exit 1; }
          if [ "$RAN" != "$SAID" ]; then
            echo "::error::README says $SAID tests and the suite ran $RAN"
            exit 1
          fi
          echo "test count matches"

      # The version contract is a runtime control, so CI exercises it as one.
      # It must PASS on its own version and FAIL on every other — a check that
      # has only ever passed is not a check.
      - name: Contract — matches its own version
        run: |
          V=$(.build/release/walk --version)
          echo "walk reports $V"
          .build/release/walk contract --expect "$V"

      - name: Contract — MUST reject a newer consumer
        run: |
          if .build/release/walk contract --expect 9.9.9; then
            echo "::error::contract accepted a version it should have refused"
            exit 1
          fi
          echo "correctly refused"

      - name: Contract — MUST reject garbage
        run: |
          if .build/release/walk contract --expect banana; then
            echo "::error::contract accepted an unparseable version"
            exit 1
          fi
          echo "correctly refused"

      # ---------------------------------------------------------------------
      # THE OLDER-CONSUMER REFUSAL. RE-AIMED 2026-09-13, AND THE RE-AIM IS THE
      # POINT: THIS STEP HAD STOPPED BEING ABLE TO FAIL.
      #
      # It used to read `--expect 0.2.0` and was named for a specific consumer:
      # "Pixel 2.5.0 §8.5 expects 0.2.0". Both halves have since gone.
      # MEASURED off the live host surface 2026-09-13:
      #   - the consumer is `andy-photo-coach` 2.6.0 in studio pack 1.10.1;
      #     `pixel-photo-coach` is absent from the installed pack and from the
      #     live skill listing (decision #538);
      #   - its §8.5 now reads `walk contract --expect 0.5.7`, so the drift this
      #     step was watching is FIXED.
      #
      # A gate naming a consumer that no longer exists, watching a defect that is
      # already closed, is a check that can no longer fail. That is the one thing
      # this session has been systematically removing, so it does not survive in
      # that form.
      #
      # WHAT REPLACES IT IS THE PERMANENT HALF. The defect class is not "0.2.0 is
      # old" — it is "the contract must refuse a consumer written against a
      # different Walk", and the OLDER direction had no other coverage here
      # (newer and unparseable each have their own step above). The version is
      # now DERIVED from Walk.version rather than written down, so it cannot go
      # stale the way the literal did.
      - name: Contract — MUST reject an OLDER consumer
        run: |
          V=$(.build/release/walk --version)
          # One major below the current version: always strictly older, never a
          # literal anyone has to remember to update.
          OLDER="0.0.1"
          [ "$V" = "$OLDER" ] && OLDER="0.0.2"
          echo "current $V, testing refusal of $OLDER"
          if .build/release/walk contract --expect "$OLDER"; then
            echo "::error::the contract accepted a consumer written against $OLDER"
            exit 1
          fi
          .build/release/walk contract --expect "$OLDER" || true
          echo "correctly refused an older consumer"

      # AND THE REAL CONSUMER, where it is present. This is the part that
      # actually catches the next drift: it reads the pin out of the installed
      # skill rather than out of a comment, and requires the contract to ACCEPT
      # it. If the skill is re-pinned to something stale, or Walk moves without
      # the skill following, this goes red.
      #
      # It is not present on a CI runner, and it SAYS SO rather than passing
      # silently — absence is not agreement.
      - name: Contract — the installed coach skill's pin still agrees
        run: |
          SKILL=$(ls -d "$HOME"/.claude/plugins/cache/o-matic-studio/studio/*/skills/andy-photo-coach/SKILL.md 2>/dev/null | tail -1 || true)
          if [ -z "$SKILL" ]; then
            echo "not evaluated — the coach skill is not installed on this host"
            echo "  (expected on a CI runner; this check is meaningful on a developer machine)"
            exit 0
          fi
          PIN=$(grep -oE 'walk contract --expect [0-9]+\.[0-9]+\.[0-9]+' "$SKILL" | head -1 | awk '{print $NF}')
          [ -n "$PIN" ] || { echo "::error::could not read a Walk pin out of $SKILL"; exit 1; }
          echo "coach skill pins Walk $PIN"
          if ! .build/release/walk contract --expect "$PIN"; then
            echo "::error::the installed coach skill pins Walk $PIN and this tree is $(.build/release/walk --version) — one of them must move"
            exit 1
          fi
          echo "the consumer and the engine agree on $PIN"

      # Capabilities and notImplemented must stay disjoint, checked through the
      # shipped binary rather than only in a unit test.
      - name: Capability lists are disjoint at runtime
        run: |
          .build/release/walk contract > /tmp/contract.txt
          cat /tmp/contract.txt
          # INDENTATION IS THE DISCRIMINATOR, not field count. 0.4.0 prints a
          # wrapped reason under every absent capability, and an `awk NF==1`
          # parser would have started matching prose. Capability lines are
          # indented two spaces; reason lines are indented six.
          CAPS=$(grep -E '^  [a-z][a-zA-Z0-9._]* +[0-9]+\.[0-9]+\.[0-9]+$' /tmp/contract.txt | awk '{print $1}' | sort -u)
          NOT=$(sed -n '/^NOT implemented/,$p' /tmp/contract.txt | grep -E '^  [a-z][a-zA-Z0-9._]*$' | tr -d ' ' | sort -u)
          BOTH=$(comm -12 <(echo "$CAPS") <(echo "$NOT"))
          if [ -n "$BOTH" ]; then
            echo "::error::listed as both present and not implemented: $BOTH"
            exit 1
          fi
          echo "disjoint"
          # And every absent capability must have printed a reason. The unit test
          # asserts the map is complete; this asserts the SHIPPED BINARY says so,
          # because #507's defect was a consumer reading the contract output and
          # believing a bare word.
          MISSING=$(sed -n '/^NOT implemented/,$p' /tmp/contract.txt | grep -c 'NO REASON RECORDED' || true)
          if [ "$MISSING" != "0" ]; then
            echo "::error::$MISSING absent capabilities printed with no reason"
            exit 1
          fi
          echo "every absent capability carries a reason"

      # THE MCP FRONT DOOR. Decision #507 makes this the primary way in, so it
      # is checked as a protocol surface and not merely compiled.
      - name: walk-mcp starts and names its surface
        run: |
          .build/release/walk-mcp --selftest
          [ "$(.build/release/walk-mcp --version)" = "$(.build/release/walk --version)" ] \
            || { echo "::error::walk-mcp and walk report different versions from the same source"; exit 1; }

      # Replays the LEGACY handshake exactly as Claude Code 2.1.258 sent it —
      # captured off the wire on 2026-09-12, not imagined — and the modern
      # server/discover path the current revision requires, and requires the
      # refusals: an unsupported protocol version, an unknown tool, and a
      # consumer written against 0.2.0. A gate that has only ever accepted is
      # not a gate.
      - name: walk-mcp answers both protocol eras and refuses what it must
        run: ./.github/mcp-handshake.sh .build/release/walk-mcp

      # The README's tool block against the LIVE schema, both directions: a
      # parameter the server takes and nobody documented, and a parameter the
      # README names that no tool has. Same defect class as everything else this
      # workflow guards — prose describing a mechanism that has moved — and it
      # is the copy a consumer reads first.
      - name: README tool docs match the live tool schema
        run: ./.github/check-tool-docs.py .build/release/walk-mcp

      # THE DOCTRINE IN THE `instructions` STRING. 0.4.1 served "It never
      # renders a keep/pitch verdict — sorting and flagging is Walk's job,
      # judgment is yours and the operator's" to every consumer on connect,
      # ahead of every tool call, after decision #513 had reversed exactly that.
      # A consumer told "never renders a verdict" does not ask for one, so the
      # stale prose SUPPRESSED the feature. 0.5.0 corrected it in seven places
      # and five of those nobody had found — by reading, because nothing here
      # could tell them.
      #
      # Every other prose surface in this workflow already has a control. The
      # most-read sentence the project owns had none. It does now, and it must
      # PROVE IT CAN FAIL before it is trusted to pass: the selftest requires
      # each failure mode — the retired sentence returning verbatim or
      # re-wrapped, a band going unnamed, the forward question dropped, and the
      # absence tie broken in EITHER direction.
      - name: Doctrine check can fail
        run: ./.github/check-doctrine.py --selftest

      # QUOTED, because an unquoted " #513" starts a YAML comment and silently
      # truncated this step's name to "Served instructions state" — a decision
      # number vanishing out of the label of the step that enforces it.
      - name: "Served instructions state #513's doctrine"
        run: ./.github/check-doctrine.py .build/release/walk-mcp .build/release/walk

      # THE INSTALL PATH, and it is here because its ABSENCE is what task #729
      # filed. MEASURED on the operator's host 2026-09-12: the installed `walk`
      # reported 0.3.0 while the installed `walk-mcp` reported 0.5.0, from one
      # source tree, because the Makefile had `install-mcp` and NO CLI install
      # target. The door with a path stayed current; the door without one
      # drifted two releases, silently, and `walk contract --expect 0.5.0`
      # exited 1 — making Andy's skill section 8.5 gate read as failing for a
      # reason that had nothing to do with the skill.
      #
      # Same shape as the doctrine check above, so it earns its trust the same
      # way: PROVE IT CAN FAIL first. The selftest requires a blank version, a
      # stale version, a missing build and an unreadable Version.swift each to
      # fail, and the matching case to pass.
      - name: Install check can fail
        run: ./.github/stage-binary.sh --selftest

      # Then the real thing, on both front doors, into a throwaway BINDIR — the
      # runner's own ~/.local/bin is not the subject. This fails if either
      # binary cannot name itself or names a version other than the tree's.
      - name: Both front doors stage and match Walk.version
        run: |
          BINDIR=$(mktemp -d)/bin
          ./.github/stage-binary.sh walk        .build/release/walk        "$BINDIR"
          ./.github/stage-binary.sh walk-mcp    .build/release/walk-mcp    "$BINDIR"
          DECLARED=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/WalkKit/Version.swift)
          # The gate a consumer actually runs, against what was just staged.
          "$BINDIR/walk" contract --expect "$DECLARED"
          echo "both front doors staged and agree on $DECLARED"

      # The app target must build. SwiftPM cannot produce a bundle, so this is
      # the only thing that proves the SwiftUI target still compiles.
      - name: Build the app
        run: |
          xcodebuild -project App/Walk.xcodeproj -scheme Walk -configuration Release \
            CODE_SIGNING_ALLOWED=NO build

      # THE APP MUST NOT WALK FOLDERS BY ITSELF AGAIN. That is decision #507's
      # defect in one line: ProofSheetModel held its own contentsOfDirectory
      # call and its own videoExtensions set, so the app did folder-walking the
      # library did not declare and `ingest.dump` sat in notImplemented while it
      # happened. ClipFinder owns it now. Comments may name it; code may not.
      - name: Folder enumeration lives in WalkKit, not in a front door
        run: |
          HITS=$(grep -rnE "contentsOfDirectory|FileManager\.default\.enumerator" App/ Sources/walk/ Sources/walk-mcp/ \
                 | grep -vE ":[0-9]+:[[:space:]]*(//|\*|///)" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::a front door is enumerating a directory itself — use ClipFinder"
            exit 1
          fi
          grep -q "enum ClipFinder" Sources/WalkKit/ClipFinder.swift \
            || { echo "::error::ClipFinder is gone"; exit 1; }
          echo "folder enumeration is in WalkKit only"

      # ---------------------------------------------------------------------
      # THE #254 BRAND GATE — task #772.
      #
      # Brandy's gate over the criteria set was design_verified: a verdict with
      # nothing able to refuse. Smith built the executable half and measured its
      # own closing caveat — the gate stays design_verified "until it lands in
      # CI and something red actually blocks a release." These two steps are
      # that landing, and they are in this order on purpose.
      #
      # THE SUITE FIRST, so the gate is never trusted before it has been watched
      # failing. It proves each of the eight detectors refuses its own dirty
      # fixture, that disabling a detector turns that fixture green (so no
      # detector is decorative), and that the #536 re-aim narrowed N2 rather
      # than disabling it.
      # ONE HOME FIRST. MEASURED 2026-09-13: the check existed in two places,
      # had diverged, and the stale copy crashed while exiting 0. Proving the
      # detectors in a copy nobody runs proves nothing, so this is checked
      # before the suite rather than after it.
      - name: The brand gate has one home, and that check can fail
        run: |
          ./Tools/brand-gate/check-single-home.sh --selftest
          ./Tools/brand-gate/check-single-home.sh

      - name: Brand gate can fail
        run: python3 Tools/brand-gate/run_eval.py

      # THEN the gate itself, BLOCKING. A criteria set carrying a #254
      # violation cannot reach the public marketplace through this workflow.
      #
      # THIS WAS `continue-on-error` FOR ONE PASS AND IS NOT ANY MORE. It was
      # soft while nine findings in the `origin` fields awaited an operator
      # ruling reconciling #505 with #536. He ruled on 2026-09-13 — persona name
      # and pack version out, every decision number kept — the edit was applied
      # under a guard, and the gate went to zero unwaived findings. A softened
      # gate outliving the reason it was softened is the same defect class as
      # everything else this repository is built around, so it came off in the
      # same commit that made it unnecessary.
      - name: "#254 brand gate on the shipped criteria set"
        run: python3 Tools/brand-gate/brand_gate_254.py criteria/walk-criteria.json --waivers Tools/brand-gate/waivers.txt

      # THE TRIPWIRE, AND IT NOW GUARDS AGAINST THE SOFTENING COMING BACK.
      # continue-on-error is exactly the kind of temporary softening that becomes
      # permanent because nothing notices it. It is gone; this fails if anyone
      # reintroduces it anywhere in this workflow while criteria ship.
      - name: The brand gate stays blocking
        run: |
          SHIPS=$(grep -c 'shippedCriteriaJSON: String? = nil' Sources/WalkKit/Coaching.swift || true)
          SOFT=$(grep -c 'continue-on-error: true' .github/workflows/ci.yml || true)
          if [ "$SHIPS" = "0" ] && [ "$SOFT" != "0" ]; then
            echo "::error::a criteria set now ships inside Walk, so the #254 gate must block. Remove continue-on-error from the brand gate step."
            exit 1
          fi
          echo "shippedCriteriaJSON nil=$SHIPS  soft-gate markers=$SOFT  — consistent"

      # ---------------------------------------------------------------------
      # THE PLUGIN PAYLOAD — decision #534. The repository root IS the plugin
      # root, so every manifest, launcher and skill here is shipped content and
      # CI must judge it as such. `make plugin-check` is the same check the
      # staging target runs locally, so the two cannot diverge.
      - name: Plugin payload is shippable
        run: |
          ./.github/stage-binary.sh walk-mcp .build/release/walk-mcp "$PWD/bin"
          make plugin-check

      # The tag must equal the version in source. This is the control that stops
      # a release being tagged v0.3.0 while the binary reports 0.2.0.
      - name: Tag matches Walk.version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC=$(.build/release/walk --version)
          echo "tag=$TAG source=$SRC"
          [ "$TAG" = "$SRC" ] || { echo "::error::tag $TAG != source $SRC"; exit 1; }
